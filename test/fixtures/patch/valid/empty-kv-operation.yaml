# yaml-language-server: $schema=../../../../api/jsonschema/harp.bundle.v1/Patch.json
apiVersion: harp.elastic.co/v1
kind: BundlePatch
meta:
  name: "empty-kv"
  owner: security@elastic.co
  description: "Patch secrets with an empty kv operation"
spec:
  rules:
    - selector:
        matchPath:
          regex: ".*"
      package:
        data:
          kv: {}
