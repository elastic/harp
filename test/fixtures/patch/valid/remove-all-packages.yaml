# yaml-language-server: $schema=../../../../api/jsonschema/harp.bundle.v1/Patch.json
apiVersion: harp.elastic.co/v1
kind: BundlePatch
meta:
  name: "all-packages-remover"
  owner: security@elastic.co
  description: "Remove all packages in the bundle"
spec:
  rules:
    - selector:
        matchPath:
          regex: ".*"
      package:
        remove: true
